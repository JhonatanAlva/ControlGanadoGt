# docker-compose.yml
services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: controlganado_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    # Solo accesible desde esta máquina (no desde la red local)
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - controlganado_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  # No arranca por defecto. Para usarlo: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: controlganado_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - controlganado_net

  # ── Backend Node.js ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlganado_backend
    restart: always
    environment:
      NODE_ENV:              production
      PORT:                  3000
      DB_HOST:               postgres
      DB_PORT:               5432
      DB_USER:               ${DB_USER}
      DB_PASSWORD:           ${DB_PASSWORD}
      DB_NAME:               ${DB_NAME}
      JWT_SECRET:            ${JWT_SECRET}
      JWT_EXPIRES_IN:        ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN:           ${CORS_ORIGIN:-}
      TRUST_PROXY:           ${TRUST_PROXY:-0}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_HOST:             ${MAIL_HOST:-}
      MAIL_PORT:             ${MAIL_PORT:-587}
      MAIL_SECURE:           ${MAIL_SECURE:-false}
      MAIL_USER:             ${MAIL_USER:-}
      MAIL_PASS:             ${MAIL_PASS:-}
      MAIL_FROM:             ${MAIL_FROM:-}
    # Para probar desde un celular físico en tu red, cambia a "3000:3000"
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - controlganado_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend — descomentar cuando esté listo ───────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: controlganado_frontend
  #   restart: always
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - controlganado_net

volumes:
  postgres_data:

networks:
  controlganado_net:
    driver: bridge